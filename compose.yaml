services:
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - budget_data:/app/data
      - budget_backups:/app/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/accounts/login/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
volumes:
  budget_data:
  budget_backups:
