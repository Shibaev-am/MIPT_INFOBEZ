<form method="get" class="filters" aria-label="Фильтры операций">
{% for field in filter_form %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}
<div class="filter-actions"><button class="button secondary">Показать</button><a href="{{ request.path }}">Сбросить</a></div>
{% if filter_form.non_field_errors %}<div class="field-errors">{{ filter_form.non_field_errors }}</div>{% endif %}</form>
